# Skip configuration for the ToolKit module
#
# Kotlin dependencies and Gradle build options for this module.
# The Kotlin helpers in this folder (*.kt) use CameraX (live camera preview
# for the "calcar" screen), ExifInterface (photo rotation) and ZXing
# (QR code generation on Android).
build:
  contents:
    - block: 'dependencies'
      contents:
        - 'implementation("androidx.camera:camera-camera2:1.4.2")'
        - 'implementation("androidx.camera:camera-lifecycle:1.4.2")'
        - 'implementation("androidx.camera:camera-view:1.4.2")'
        - 'implementation("androidx.lifecycle:lifecycle-runtime-compose:2.9.4")'
        - 'implementation("androidx.exifinterface:exifinterface:1.4.1")'
        - 'implementation("com.google.zxing:core:3.5.3")'

# this is a transpiled Skip Lite module
skip:
  mode: 'transpiled'
